# Netlify config for the baileysgroup.com phase-1 rebuild (see MIGRATION-STATUS.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7.4 requires Node >= 22.22.0
  NODE_VERSION = "22"

# Preview-only noindex: adds X-Robots-Tag on *.netlify.app hosts so the preview never competes with the
# live Webflow site. Custom domains (www.baileysgroup.com after cutover) are unaffected.
[[edge_functions]]
  path = "/*"
  function = "noindex-netlify-app"

# Eurostile font: same-origin proxy to R2 so @font-face needs no CORS on media.baileysallied.com.
# The file itself lives in R2 (bms-media/baileysgroup/fonts/), not in this repo.
[[redirects]]
  from = "/_media/fonts/*"
  to = "https://media.baileysallied.com/baileysgroup/fonts/:splat"
  status = 200
  force = true
  [redirects.headers]
    X-From = "Netlify"

# Unlisted signature-request form: never indexed (also has a robots meta tag; not in sitemap.xml).
[[headers]]
  for = "/signature-request*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Security sweep 2026-10-28: baseline response headers on every page (no change to how pages look or behave).
# Deliberately NOT set here: Content-Security-Policy (needs Jake's decision; the Webflow-era scripts and GTM would need testing).
# Same values as www.baileysallied.com (tools/write-headers.mjs there), minus the interest-cohort token Chrome no longer recognizes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "browsing-topics=(), camera=(), display-capture=(), geolocation=(self), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=(), xr-spatial-tracking=()"
