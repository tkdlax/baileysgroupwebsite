<!-- Bailey's Moving & Storage: Workplace signature. Built by the Admin Assistant from a form request (needs a headshot).
     Placeholders: {{first_name}} {{last_name}} {{title}} {{phone1_label}} {{phone1}} {{phone2_label}} {{phone2}} {{email}} {{website}} {{linkedin}} {{headshot_url}}
     {{headshot_url}} = https://media.baileysallied.com/workplace-headshots/FirstName_LastName.png
     Drop the phone 2 row if empty; drop the LinkedIn cell if no {{linkedin}}. -->
<table cellspacing="0" cellpadding="0" style="background-color:#ffffff;width:600px;max-width:600px;border-collapse:collapse;border-spacing:0">
  <tr><td colspan="3"><img alt="Bailey's Workplace Header" width="600" height="75" src="https://media.baileysallied.com/signatures/workplace/header.png" style="width:600px;height:75px;display:block;border:0"></td></tr>
  <tr>
    <td style="width:24px"></td>
    <td style="padding-top:18px;padding-bottom:16px;vertical-align:top">
      <table cellspacing="0" cellpadding="0" style="border-collapse:collapse;border-spacing:0">
        <tr><td style="line-height:normal;padding-top:4px;color:#0f1b3d"><div style="font-family:Helvetica,Arial,sans-serif;font-size:24px">{{first_name}} <span style="font-weight:700">{{last_name}}</span></div></td></tr>
        <tr><td style="line-height:normal;padding-top:2px;padding-bottom:12px;color:#f1632a"><div style="font-family:Helvetica,Arial,sans-serif;font-size:18px">{{title}}</div></td></tr>
        <tr><td style="line-height:normal;padding-bottom:6px;color:#1f2a44"><div style="font-family:Helvetica,Arial,sans-serif;font-size:16px"><b>{{phone1_label}}:</b>&nbsp;<a href="tel:+1{{phone1_tel}}" style="color:#1f2a44;text-decoration:none">{{phone1}}</a></div></td></tr>
        <tr><td style="line-height:normal;padding-bottom:6px;color:#1f2a44"><div style="font-family:Helvetica,Arial,sans-serif;font-size:16px"><b>{{phone2_label}}:</b>&nbsp;<a href="tel:+1{{phone2_tel}}" style="color:#1f2a44;text-decoration:none">{{phone2}}</a></div></td></tr>
        <tr><td style="line-height:normal;padding-bottom:12px;color:#1f2a44"><div style="font-family:Helvetica,Arial,sans-serif;font-size:16px"><b>Email:</b>&nbsp;<a href="mailto:{{email}}" style="color:#1f2a44;text-decoration:none">{{email}}</a></div></td></tr>
      </table>
    </td>
    <td style="text-align:center;vertical-align:top;width:160px">
      <img alt="Profile photo" width="115" height="115" src="{{headshot_url}}" style="width:115px;height:115px;margin:0 auto;border:4px solid #ffffff;border-radius:999px;display:block">
      <table cellspacing="0" cellpadding="0" style="margin:0 auto;border-collapse:collapse;border-spacing:0">
        <tr>
          <td style="text-align:center;padding-right:10px"><a href="{{website}}" target="_blank" style="text-decoration:none"><img alt="Website" width="28" height="28" src="https://media.baileysallied.com/signatures/workplace/globe.png" style="width:28px;height:28px;display:inline-block;border:0"></a></td>
          <td style="text-align:center"><a href="{{linkedin}}" target="_blank" style="text-decoration:none"><img alt="LinkedIn" width="28" height="28" src="https://media.baileysallied.com/signatures/workplace/linkedin.png" style="width:28px;height:28px;display:inline-block;border:0"></a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
