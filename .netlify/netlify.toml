redirectsOrigin = "config"
plugins = []
headers = []

[build]
edge_functions = "/workspace/baileysgroupwebsite/netlify/edge-functions"
publish = "/workspace/baileysgroupwebsite/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"

[build.environment]
NODE_VERSION = "22"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[edge_functions]]
path = "/*"
function = "noindex-netlify-app"

[functions]

[functions."*"]

[[redirects]]
from = "/_media/fonts/*"
to = "https://media.baileysallied.com/baileysgroup/fonts/:splat"
status = 200.0
force = true

[redirects.query]

[redirects.conditions]

[redirects.headers]
X-From = "Netlify"